name: SuperNotch one-shot rebrand

on:
  push:
    branches:
      - branding/supernotch

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebrand application code to SuperNotch
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          replacements = (
              ('NotchShelf', 'SuperNotch'),
              ('notchshelf', 'supernotch'),
              ('NOTCHSHELF', 'SUPERNOTCH'),
          )

          def is_workflow(path: Path) -> bool:
              parts = path.parts
              return len(parts) >= 2 and parts[0] == '.github' and parts[1] == 'workflows'

          # Rewrite all UTF-8 application/project/docs text. Workflow files are
          # intentionally handled separately because GITHUB_TOKEN cannot push
          # workflow changes without the workflows permission.
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or is_workflow(path):
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              updated = data
              for old, new in replacements:
                  updated = updated.replace(old, new)

              if updated != data:
                  path.write_text(updated, encoding='utf-8')

          # Rename application/project paths from deepest to shallowest.
          paths = sorted(
              [p for p in root.rglob('*') if '.git' not in p.parts and not is_workflow(p)],
              key=lambda p: len(p.parts),
              reverse=True,
          )
          for path in paths:
              name = path.name
              new_name = name
              for old, new in replacements:
                  new_name = new_name.replace(old, new)
              if new_name == name:
                  continue

              target = path.with_name(new_name)
              if target.exists():
                  raise RuntimeError(f'rename collision: {path} -> {target}')
              path.rename(target)
          PY

          echo 'Checking application code for stale brand identifiers...'
          if git grep -n -I \
            -e 'NotchShelf' -e 'notchshelf' -e 'NOTCHSHELF' \
            -- . ':!.github/workflows/**' ':!RELEASE_TRIGGER*'; then
            echo 'Found stale NotchShelf branding after rebrand.' >&2
            exit 1
          fi

          if find . \
            -path './.git' -prune -o \
            -path './.github/workflows' -prune -o \
            -name '*NotchShelf*' -print | grep -q .; then
            echo 'Found stale NotchShelf path names after rebrand.' >&2
            find . \
              -path './.git' -prune -o \
              -path './.github/workflows' -prune -o \
              -name '*NotchShelf*' -print
            exit 1
          fi

          git status --short

      - name: Commit SuperNotch rebrand
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/**'
          git diff --cached --check
          git commit -m 'refactor: rebrand NotchShelf to SuperNotch'
          git push origin HEAD:branding/supernotch
