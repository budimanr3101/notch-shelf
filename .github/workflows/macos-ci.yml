name: macOS CI

on:
  push:
    branches:
      - main
      - 'hardening/**'
      - 'branding/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SuperNotch
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject stale pre-rebrand identifiers
        shell: bash
        run: |
          set -euo pipefail
          OLD_CAMEL="Notch""Shelf"
          OLD_LOWER="notch""shelf"
          OLD_UPPER="NOTCH""SHELF"

          if git grep -n -I -e "$OLD_CAMEL" -e "$OLD_LOWER" -e "$OLD_UPPER" -- .; then
            echo "Found stale pre-rebrand identifiers."
            exit 1
          fi

          if find . -path './.git' -prune -o -name "*${OLD_CAMEL}*" -print | grep -q .; then
            echo "Found stale pre-rebrand path names."
            find . -path './.git' -prune -o -name "*${OLD_CAMEL}*" -print
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate shared scheme
        run: |
          xcodebuild \
            -project SuperNotch.xcodeproj \
            -list

      - name: Build Debug
        run: |
          set -o pipefail
          xcodebuild \
            -project SuperNotch.xcodeproj \
            -scheme SuperNotch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SuperNotchDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
