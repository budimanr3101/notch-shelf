name: SuperNotch icon generation

on:
  push:
    branches:
      - branding/supernotch
    paths:
      - '.github/workflows/supernotch-icon-once.yml'

permissions:
  contents: write

jobs:
  generate-icon:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate SuperNotch SN monogram icon
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/GenerateSuperNotchIcon.swift" <<'SWIFT'
          import AppKit

          let pixels = 1024
          let canvas = NSSize(width: pixels, height: pixels)

          func color(_ hex: UInt32, alpha: CGFloat = 1) -> NSColor {
              NSColor(
                  calibratedRed: CGFloat((hex >> 16) & 0xff) / 255,
                  green: CGFloat((hex >> 8) & 0xff) / 255,
                  blue: CGFloat(hex & 0xff) / 255,
                  alpha: alpha
              )
          }

          guard let rep = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: pixels,
              pixelsHigh: pixels,
              bitsPerSample: 8,
              samplesPerPixel: 4,
              hasAlpha: true,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          ), let context = NSGraphicsContext(bitmapImageRep: rep) else {
              fatalError("Could not create bitmap context")
          }

          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = context

          NSColor.clear.setFill()
          NSRect(origin: .zero, size: canvas).fill()

          let outerRect = NSRect(x: 26, y: 26, width: 972, height: 972)
          let outer = NSBezierPath(roundedRect: outerRect, xRadius: 205, yRadius: 205)

          NSGraphicsContext.saveGraphicsState()
          outer.addClip()
          NSGradient(colors: [color(0x253552), color(0x0B111D), color(0x020409)])!
              .draw(in: outer, angle: -58)

          // Glass highlight.
          let reflection = NSBezierPath(ovalIn: NSRect(x: 85, y: 575, width: 1040, height: 520))
          NSGradient(colors: [
              color(0xFFFFFF, alpha: 0.25),
              color(0xBBD3FF, alpha: 0.07),
              color(0xFFFFFF, alpha: 0)
          ])!.draw(in: reflection, angle: -74)

          // Lower-right glass sweep.
          color(0x7C9BD5, alpha: 0.12).setFill()
          NSBezierPath(ovalIn: NSRect(x: 350, y: -250, width: 900, height: 610)).fill()
          NSGraphicsContext.restoreGraphicsState()

          // Outer rim.
          outer.lineWidth = 12
          color(0x465C80, alpha: 0.9).setStroke()
          outer.stroke()
          let innerRim = NSBezierPath(
              roundedRect: NSRect(x: 40, y: 40, width: 944, height: 944),
              xRadius: 190,
              yRadius: 190
          )
          innerRim.lineWidth = 3
          color(0xB8D1FF, alpha: 0.32).setStroke()
          innerRim.stroke()

          // Hardware notch carved into the top edge.
          let notch = NSBezierPath()
          notch.move(to: NSPoint(x: 300, y: 1010))
          notch.line(to: NSPoint(x: 724, y: 1010))
          notch.curve(
              to: NSPoint(x: 670, y: 838),
              controlPoint1: NSPoint(x: 721, y: 920),
              controlPoint2: NSPoint(x: 708, y: 845)
          )
          notch.curve(
              to: NSPoint(x: 354, y: 838),
              controlPoint1: NSPoint(x: 602, y: 822),
              controlPoint2: NSPoint(x: 422, y: 822)
          )
          notch.curve(
              to: NSPoint(x: 300, y: 1010),
              controlPoint1: NSPoint(x: 316, y: 845),
              controlPoint2: NSPoint(x: 303, y: 920)
          )
          notch.close()
          color(0x01030A).setFill()
          notch.fill()

          // Blue electric notch rim.
          let glow = NSBezierPath()
          glow.move(to: NSPoint(x: 300, y: 1010))
          glow.curve(
              to: NSPoint(x: 354, y: 838),
              controlPoint1: NSPoint(x: 303, y: 920),
              controlPoint2: NSPoint(x: 316, y: 845)
          )
          glow.curve(
              to: NSPoint(x: 670, y: 838),
              controlPoint1: NSPoint(x: 422, y: 822),
              controlPoint2: NSPoint(x: 602, y: 822)
          )
          glow.curve(
              to: NSPoint(x: 724, y: 1010),
              controlPoint1: NSPoint(x: 708, y: 845),
              controlPoint2: NSPoint(x: 721, y: 920)
          )
          let glowShadow = NSShadow()
          glowShadow.shadowColor = color(0x176CFF, alpha: 0.95)
          glowShadow.shadowBlurRadius = 25
          glowShadow.shadowOffset = .zero
          glowShadow.set()
          glow.lineWidth = 10
          color(0x5A9CFF).setStroke()
          glow.stroke()

          // SN monogram, deliberately oversized so it remains legible at 16px.
          let font = NSFont.systemFont(ofSize: 430, weight: .heavy)
          let paragraph = NSMutableParagraphStyle()
          paragraph.alignment = .left

          let letterShadow = NSShadow()
          letterShadow.shadowColor = color(0x245BFF, alpha: 0.55)
          letterShadow.shadowBlurRadius = 18
          letterShadow.shadowOffset = NSSize(width: 0, height: -6)

          let sPoint = NSPoint(x: 120, y: 205)
          let nPoint = NSPoint(x: 420, y: 205)

          let sBase: [NSAttributedString.Key: Any] = [
              .font: font,
              .foregroundColor: color(0x33D8FF),
              .paragraphStyle: paragraph,
              .shadow: letterShadow
          ]
          NSAttributedString(string: "S", attributes: sBase).draw(at: sPoint)

          NSGraphicsContext.saveGraphicsState()
          NSBezierPath(rect: NSRect(x: 0, y: 185, width: 1024, height: 265)).addClip()
          let sLower: [NSAttributedString.Key: Any] = [
              .font: font,
              .foregroundColor: color(0x8A43FF),
              .paragraphStyle: paragraph
          ]
          NSAttributedString(string: "S", attributes: sLower).draw(at: sPoint)
          NSGraphicsContext.restoreGraphicsState()

          let nBase: [NSAttributedString.Key: Any] = [
              .font: font,
              .foregroundColor: color(0xB8C5D9),
              .paragraphStyle: paragraph,
              .shadow: letterShadow
          ]
          NSAttributedString(string: "N", attributes: nBase).draw(at: nPoint)

          NSGraphicsContext.saveGraphicsState()
          NSBezierPath(rect: NSRect(x: 0, y: 505, width: 1024, height: 260)).addClip()
          let nUpper: [NSAttributedString.Key: Any] = [
              .font: font,
              .foregroundColor: color(0xF7FAFF),
              .paragraphStyle: paragraph
          ]
          NSAttributedString(string: "N", attributes: nUpper).draw(at: nPoint)
          NSGraphicsContext.restoreGraphicsState()

          context.flushGraphics()
          NSGraphicsContext.restoreGraphicsState()

          guard let png = rep.representation(using: .png, properties: [.compressionFactor: 1]) else {
              fatalError("Could not encode PNG")
          }
          try png.write(to: URL(fileURLWithPath: CommandLine.arguments[1]), options: .atomic)
          SWIFT

          mkdir -p SuperNotch/Branding
          APPICON=SuperNotch/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$APPICON"

          swift "$RUNNER_TEMP/GenerateSuperNotchIcon.swift" SuperNotch/Branding/AppIcon.png

          cp SuperNotch/Branding/AppIcon.png "$APPICON/icon_512x512@2x.png"
          sips -z 512 512 SuperNotch/Branding/AppIcon.png --out "$APPICON/icon_512x512.png" >/dev/null
          cp "$APPICON/icon_512x512.png" "$APPICON/icon_256x256@2x.png"
          sips -z 256 256 SuperNotch/Branding/AppIcon.png --out "$APPICON/icon_256x256.png" >/dev/null
          cp "$APPICON/icon_256x256.png" "$APPICON/icon_128x128@2x.png"
          sips -z 128 128 SuperNotch/Branding/AppIcon.png --out "$APPICON/icon_128x128.png" >/dev/null
          sips -z 64 64 SuperNotch/Branding/AppIcon.png --out "$APPICON/icon_32x32@2x.png" >/dev/null
          sips -z 32 32 SuperNotch/Branding/AppIcon.png --out "$APPICON/icon_32x32.png" >/dev/null
          cp "$APPICON/icon_32x32.png" "$APPICON/icon_16x16@2x.png"
          sips -z 16 16 SuperNotch/Branding/AppIcon.png --out "$APPICON/icon_16x16.png" >/dev/null

          cat > SuperNotch/Assets.xcassets/Contents.json <<'JSON'
          {
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

          cat > "$APPICON/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "icon_16x16.png", "idiom" : "mac", "scale" : "1x", "size" : "16x16" },
              { "filename" : "icon_16x16@2x.png", "idiom" : "mac", "scale" : "2x", "size" : "16x16" },
              { "filename" : "icon_32x32.png", "idiom" : "mac", "scale" : "1x", "size" : "32x32" },
              { "filename" : "icon_32x32@2x.png", "idiom" : "mac", "scale" : "2x", "size" : "32x32" },
              { "filename" : "icon_128x128.png", "idiom" : "mac", "scale" : "1x", "size" : "128x128" },
              { "filename" : "icon_128x128@2x.png", "idiom" : "mac", "scale" : "2x", "size" : "128x128" },
              { "filename" : "icon_256x256.png", "idiom" : "mac", "scale" : "1x", "size" : "256x256" },
              { "filename" : "icon_256x256@2x.png", "idiom" : "mac", "scale" : "2x", "size" : "256x256" },
              { "filename" : "icon_512x512.png", "idiom" : "mac", "scale" : "1x", "size" : "512x512" },
              { "filename" : "icon_512x512@2x.png", "idiom" : "mac", "scale" : "2x", "size" : "512x512" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

          file SuperNotch/Branding/AppIcon.png
          sips -g pixelWidth -g pixelHeight SuperNotch/Branding/AppIcon.png

      - name: Commit generated native icon assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SuperNotch/Branding/AppIcon.png SuperNotch/Assets.xcassets
          git diff --cached --check
          git commit -m 'brand: install SuperNotch SN monogram icon'
          git push origin HEAD:branding/supernotch
