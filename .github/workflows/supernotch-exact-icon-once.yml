name: SuperNotch exact icon generation

on:
  push:
    branches:
      - branding/supernotch
    paths:
      - 'SuperNotch/Branding/AppIcon.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icon:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: branding/supernotch
          fetch-depth: 0

      - name: Generate native AppIcon set from selected artwork
        shell: bash
        run: |
          set -euo pipefail
          SRC='SuperNotch/Branding/AppIcon.png'
          DEST='SuperNotch/Assets.xcassets/AppIcon.appiconset'
          test -s "$SRC"
          mkdir -p "$DEST"

          generate() {
            local px="$1"
            local name="$2"
            sips -z "$px" "$px" "$SRC" --out "$DEST/$name" >/dev/null
          }

          generate 16 icon_16x16.png
          generate 32 icon_16x16@2x.png
          generate 32 icon_32x32.png
          generate 64 icon_32x32@2x.png
          generate 128 icon_128x128.png
          generate 256 icon_128x128@2x.png
          generate 256 icon_256x256.png
          generate 512 icon_256x256@2x.png
          generate 512 icon_512x512.png
          generate 1024 icon_512x512@2x.png

          sips -g pixelWidth -g pixelHeight "$DEST/icon_512x512@2x.png"

      - name: Commit exact native icon assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SuperNotch/Assets.xcassets/AppIcon.appiconset
          if git diff --cached --quiet; then
            echo 'No icon changes to commit.'
            exit 0
          fi
          git commit -m 'chore: use selected SuperNotch icon artwork'
          git push origin HEAD:branding/supernotch
